  <!-- Passed start node -->
  <circle cx="24" cy="15" r="3.6" fill="#f2efe9"/>
  <!-- Active runner halo + dot -->
  <circle cx="40" cy="32" r="10.2" fill="#ff5a1f" fill-opacity="0.24"/>
  <circle cx="40" cy="32" r="5.4" fill="#ff5a1f"/>
  <!-- Upcoming node -->
