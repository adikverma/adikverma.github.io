<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19241a" stop-opacity="0.72"/>
      <stop offset="56%" stop-color="#070707" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#070707" stroke="#2c302c" stroke-width="2"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wash)"/>
  <!-- Symmetric S-curve running course track -->
  <path d="M 24 15 C 24 23.5, 40 23.5, 40 32 C 40 40.5, 24 40.5, 24 49" fill="none" stroke="#302f2d" stroke-width="4.4" stroke-linecap="round"/>
