<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19241a" stop-opacity="0.52"/>
      <stop offset="52%" stop-color="#070707" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070707" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#070707" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070707" stop-opacity="0.68"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>

  <!-- Left panel -->
  <rect x="14" y="14" width="562" height="602" rx="18" fill="#070707" stroke="#232c24" stroke-width="1.5"/>
  <rect x="15" y="15" width="560" height="310" rx="17" fill="url(#wash)"/>

  <text x="56" y="114" fill="#f2efe9" font-family="Inter Tight, Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.03em">Hello, I'm Aditya.</text>

  <g stroke="#222923" stroke-width="1">
    <line x1="58" y1="158" x2="532" y2="158"/>
    <line x1="58" y1="298" x2="532" y2="298"/>
    <line x1="58" y1="368" x2="532" y2="368"/>
    <line x1="58" y1="442" x2="532" y2="442"/>
    <line x1="15" y1="556" x2="575" y2="556"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#8d8982" letter-spacing="0.08em">
    <text x="58" y="190">INFO</text>
    <text x="58" y="332">ROLE</text>
    <text x="58" y="404">STACK</text>
    <text x="58" y="476">COURSE</text>
  </g>

  <g font-family="Inter Tight, Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#f2efe9">
    <text x="182" y="190">Full-stack engineer at Verisk,</text>
    <text x="182" y="216">building claims software with</text>
    <text x="182" y="242">Angular, .NET &amp; AWS. Distance</text>
    <text x="182" y="268">runner &amp; builder of RunWithTheWind.</text>
    <text x="182" y="332">Software Engineer II · Verisk</text>
    <text x="182" y="404" fill="#b4b0a8">Angular · .NET · AWS · Kotlin</text>
  </g>

  <!-- Signature S-curve running course -->
  <path d="M 186 472 C 216 456, 244 488, 274 472 C 304 456, 332 488, 362 472 C 392 456, 420 488, 450 472" fill="none" stroke="#f2efe9" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 186 472 C 216 456, 244 488, 274 472" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="186" cy="472" r="4.5" fill="#ff5a1f"/>
  <circle cx="274" cy="472" r="10" fill="#ff5a1f" fill-opacity="0.28"/>
  <circle cx="274" cy="472" r="5" fill="#ff5a1f"/>
  <circle cx="362" cy="472" r="4.5" fill="#070707" stroke="#f2efe9" stroke-opacity="0.34" stroke-width="1.8"/>
  <circle cx="450" cy="472" r="4.5" fill="#070707" stroke="#f2efe9" stroke-opacity="0.34" stroke-width="1.8"/>
  <text x="182" y="512" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8d8982" letter-spacing="0.04em">01 NAMASTE · 02 PROJECT · 03 RUNNING · 04 ART</text>

  <circle cx="64" cy="586" r="4.5" fill="#ff5a1f"/>
  <text x="80" y="590" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#f2efe9" letter-spacing="0.1em">ADIKVERMA.GITHUB.IO</text>
  <text x="444" y="590" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#8d8982" letter-spacing="0.08em">01 / 04 KM</text>

  <!-- Right panel -->
  <rect x="590" y="14" width="596" height="602" rx="18" fill="#131915" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="590" y="14" width="596" height="602" rx="18" fill="url(#scrim)"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#f6f4f0" letter-spacing="0.08em">
    <text x="1084" y="52" fill-opacity="0.92">EMAIL ↗</text>
    <text x="622" y="320">01</text>
    <text x="1074" y="320">ABOUT ME</text>
    <text x="888" y="586" text-anchor="middle" font-size="12" fill-opacity="0.82" letter-spacing="0.1em">SCROLL TO BROWSE</text>
  </g>
  <text x="888" y="318" text-anchor="middle" font-family="Inter Tight, Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f6f4f0">Namaste</text>
  <rect x="880" y="342" width="16" height="1.5" fill="#f6f4f0" fill-opacity="0.62"/>
  <rect x="880" y="356" width="16" height="1.5" fill="#f6f4f0" fill-opacity="0.44"/>
  <rect x="880" y="370" width="16" height="1.5" fill="#f6f4f0" fill-opacity="0.28"/>
  <text x="888" y="408" text-anchor="middle" font-family="Inter Tight, Noto Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#f6f4f0" fill-opacity="0.5">Run with the Wind</text>
</svg>
