<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="65%" stop-color="#111724"/>
      <stop offset="100%" stop-color="#22100E"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#F03010" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#F03010" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle tailwind contour lines -->
  <g fill="none" stroke="#F2F5FA" stroke-opacity="0.06" stroke-width="1.5">
    <path d="M -20 110 C 260 60, 560 160, 920 95 S 1140 120, 1220 90"/>
    <path d="M -20 165 C 290 125, 590 210, 940 150 S 1140 175, 1220 148"/>
    <path d="M -20 515 C 280 475, 600 555, 960 495 S 1140 525, 1220 500"/>
  </g>

  <!-- Left column: Brand & pitch -->
  <rect x="76" y="76" width="52" height="52" rx="14" fill="#06080C" stroke="#263042" stroke-width="1.5"/>
  <path d="M 90 116 C 89 101, 95 90, 112 88 C 113 103, 106 114, 90 116 Z" fill="none" stroke="#F03010" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="103" cy="96" r="2.2" fill="#F03010"/>

  <text x="146" y="98" fill="#FF6847" font-family="Plus Jakarta Sans, Noto Sans, sans-serif" font-size="16" font-weight="600" letter-spacing="0.04em">WEAR OS &amp; ANDROID</text>
  <text x="146" y="121" fill="#8B98AD" font-family="Plus Jakarta Sans, Noto Sans, sans-serif" font-size="15">In development · personal project</text>

  <text x="76" y="256" fill="#F2F5FA" font-family="Barlow Condensed, Noto Sans, sans-serif" font-size="96" font-weight="700" letter-spacing="-0.01em">RUN WITH</text>
  <text x="76" y="344" fill="#F2F5FA" font-family="Barlow Condensed, Noto Sans, sans-serif" font-size="96" font-weight="700" letter-spacing="-0.01em">THE WIND</text>

  <text x="76" y="408" fill="#B7C1D1" font-family="Plus Jakarta Sans, Noto Sans, sans-serif" font-size="25" font-weight="500">Record on your wrist, sync to your phone,</text>
  <text x="76" y="444" fill="#B7C1D1" font-family="Plus Jakarta Sans, Noto Sans, sans-serif" font-size="25" font-weight="500">share to Strava.</text>

  <line x1="76" y1="510" x2="590" y2="510" stroke="#263042" stroke-width="1.2"/>
  <text x="76" y="552" fill="#8B98AD" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="0.06em">ADIKVERMA.GITHUB.IO/RUNWITHTHEWIND</text>

  <!-- Right visual: Wear OS watch + companion phone silhouette -->
  <!-- Phone frame -->
  <rect x="855" y="110" width="265" height="430" rx="34" fill="#131822" stroke="#394760" stroke-width="2"/>
  <rect x="871" y="128" width="233" height="394" rx="22" fill="#0B0E14"/>
  <text x="892" y="166" fill="#8B98AD" font-family="JetBrains Mono, monospace" font-size="13">MORNING TEMPO</text>
  <text x="892" y="206" fill="#F2F5FA" font-family="Barlow Condensed, Noto Sans, sans-serif" font-size="42" font-weight="700">6.42 KM</text>
  <text x="1008" y="206" fill="#B7C1D1" font-family="Barlow Condensed, Noto Sans, sans-serif" font-size="28" font-weight="600">4:08 /KM</text>
  <!-- GPS route loop -->
  <rect x="888" y="226" width="199" height="162" rx="14" fill="#131822" stroke="#263042" stroke-width="1"/>
  <path d="M 926 334 C 912 292, 954 252, 1004 256 C 1052 260, 1072 296, 1052 332 C 1034 364, 944 374, 926 334 Z" fill="none" stroke="#F03010" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="926" cy="334" r="5" fill="#6FE3A8"/>
  <circle cx="1052" cy="332" r="5" fill="#FF6847"/>
  <!-- Pace/HR sparkline -->
  <rect x="888" y="404" width="199" height="92" rx="14" fill="#131822" stroke="#263042" stroke-width="1"/>
  <path d="M 904 468 L 932 456 L 960 462 L 988 442 L 1016 448 L 1044 434 L 1072 440" fill="none" stroke="#FF6847" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Round Wear OS watch overlapping left of phone -->
  <circle cx="775" cy="348" r="138" fill="#1A212E" stroke="#394760" stroke-width="3"/>
  <circle cx="775" cy="348" r="122" fill="#06080C"/>
  <!-- Progress arc -->
  <circle cx="775" cy="348" r="110" fill="none" stroke="#263042" stroke-width="5"/>
  <path d="M 775 238 A 110 110 0 1 1 680 403" fill="none" stroke="#F03010" stroke-width="6" stroke-linecap="round"/>
  <text x="775" y="302" text-anchor="middle" fill="#8B98AD" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="0.08em">PACE</text>
  <text x="775" y="366" text-anchor="middle" fill="#F2F5FA" font-family="Barlow Condensed, Noto Sans, sans-serif" font-size="68" font-weight="700">4:08</text>
  <text x="775" y="408" text-anchor="middle" fill="#FF6847" font-family="JetBrains Mono, monospace" font-size="18">162 BPM · 6.42 KM</text>
</svg>
